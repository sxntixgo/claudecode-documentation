site_name: Claude Code Documentation
site_description: A comprehensive, verified guide to Claude Code — MCP servers, agents, skills, hooks, context engineering, and cost optimization.
# The sxntixgo.github.io user site has a custom domain, so GitHub serves
# every project page under it rather than github.io.
site_url: https://gimenezocano.com/claudecode-documentation/
repo_url: https://github.com/sxntixgo/claudecode-documentation
repo_name: sxntixgo/claudecode-documentation
edit_uri: edit/main/

# docs/ is assembled by scripts/build-site.sh, not checked in. The markdown
# stays where it has always lived, so every existing relative link between
# guides keeps working untouched.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant       # SPA-style loads
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # copy button on every code block
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  # Renders ```mermaid fences natively — no extra JS needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sxntixgo/claudecode-documentation

